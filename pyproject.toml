[project]
name = "noc-incident-resolution-agent"
version = "0.1.0"
description = "Grounded RAG copilot for NOC incident drafts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain-core>=0.2.0",
  "langchain-openai>=0.1.7",
  "langchain-community>=0.2.0",
  "chromadb>=0.5.0",
  "pydantic>=2.7.0",
  "openai>=1.30.0",
  "instructor>=1.0.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "streamlit>=1.35.0",
  "python-dotenv>=1.0.0",
  "python-ulid>=4.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "deepeval>=1.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pre-commit>=3.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/app.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
files = ["src", "app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
